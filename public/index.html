<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Halay Zamanı</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    body.transparent { background: transparent; }
    #wrap { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    #stack { position: relative; }
    #stack canvas { display: block; }
    #ui { position: absolute; left: 0; top: 0; pointer-events: none; }
    #hint {
      position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
      font: 600 15px/1.3 system-ui, sans-serif; color: #fff; background: rgba(0,0,0,.75);
      padding: 8px 14px; border-radius: 999px; cursor: pointer; display: none; z-index: 5;
    }
    /* müzik düğmesi: yayında görünmesin diye sadece fare sayfanın üstündeyken belirir (OBS'te "Etkileşim" penceresinde) */
    #musicBtn {
      position: fixed; right: 16px; bottom: 16px; z-index: 7; opacity: 0; transition: opacity .2s;
      font: 700 15px/1 system-ui, sans-serif; color: #fff; background: rgba(20,8,36,.9);
      border: 1px solid rgba(255,255,255,.3); border-radius: 999px; padding: 10px 16px; cursor: pointer;
    }
    body:hover #musicBtn, #musicBtn:focus-visible { opacity: 1; }
    #musicBtn.off { background: rgba(150,20,50,.92); }
  </style>
  <script type="importmap">
    { "imports": {
        "three": "/vendor/three/build/three.module.js",
        "three/addons/": "/vendor/three/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div id="wrap"><div id="stack"><canvas id="scene"></canvas><canvas id="ui"></canvas></div></div>
  <div id="hint">🔊 Ses için tıkla</div>
  <button id="musicBtn" type="button">🎵 Müzik açık</button>
  <script src="config.js"></script>
  <script src="sim.js"></script>
  <script type="module" src="game.js"></script>
</body>
</html>
